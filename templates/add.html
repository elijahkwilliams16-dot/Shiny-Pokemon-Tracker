<!DOCTYPE html>

<head>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


<h1>✨ Add Shiny Pokémon</h1>


<form method="POST">


<label>Pokémon Name:</label>

<input 
type="text"
name="name"
required
>


<br><br>


<label>Game:</label>

<input
type="text"
name="game"
required
>


<br><br>

type="text"
name="method"
required
>


<br><br>

name="date"
required
>

<button type="submit">
Add Shiny
</button>


</form>



<a href="/">
Back Home
</a>


</div>
