<!DOCTYPE html>
<html>

<head>

    <title>Add Shiny Pokémon</title>

    <!-- Connects this page to our CSS file -->
    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <!-- Main container for the page -->
    <div class="container">

        <h1>✨ Add Shiny Pokémon ✨</h1>

        <!--
            class="add-form"
            This lets CSS style the entire form as a grid.
        -->
        <form method="POST" class="add-form">

            <!-- Pokémon Name -->
            <div class="form-group">

                <label for="name">Pokémon Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>

            <!-- Game -->
            <div class="form-group">

                <label for="game">Game</label>

                <select
                    id="game"
                    name="game"
                    required
                >

                    <option value="">Select a Game</option>

                    <!--
                        Flask automatically creates one option
                        for every game inside GAME_TO_GEN.
                    -->
                    {% for game in games %}

                        <option value="{{ game }}">
                            {{ game.title() }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <!-- Method -->
            <div class="form-group">

                <label for="method">Method</label>

                <input
                    type="text"
                    id="method"
                    name="method"
                    placeholder="Masuda, Soft Reset, Sandwich..."
                    required
                >

            </div>

            <!-- Date -->
            <div class="form-group">

                <label for="date">Date Caught</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>

            <!-- Submit Button -->
            <button type="submit">
                ✨ Add Shiny
            </button>

        </form>

        <br>

        <a href="/">
            ← Back Home
        </a>

    </div>

</body>

</html>
