<!DOCTYPE html>
<html>

<head>
    <title>Add Shiny Pokémon</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

<div class="container">

    <header class="header">

        <div>
            <h1>✨ Add Shiny Pokémon</h1>

            <p>
                Add a new shiny Pokémon to your collection.
            </p>
        </div>

        <a
            href="/"
            class="add-button"
        >
            ← Back Home
        </a>

    </header>


    <form
        method="POST"
        class="add-form"
    >

        <!-- POKÉMON NAME -->

        <div class="form-group">

            <label for="name">
                Pokémon Name
            </label>

            <div class="autocomplete">

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Start typing a Pokémon..."
                    autocomplete="off"
                    required
                >

                <div
                    id="suggestions"
                    class="suggestions"
                ></div>

            </div>

        </div>


        <!-- GAME -->

        <div class="form-group">

            <label for="game">
                Game
            </label>

            <select
                id="game"
                name="game"
                required
            >

                <option value="">
                    Select a Game
                </option>

                {% for game in games %}

                    <option value="{{ game }}">
                        {{ game.title() }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- METHOD -->

        <div class="form-group">

            <label for="method">
                Method
            </label>

            <input
                type="text"
                id="method"
                name="method"
                placeholder="Masuda, Soft Reset, Sandwich..."
                required
            >

        </div>


        <!-- DATE -->

        <div class="form-group">

            <label for="date">
                Date Caught
            </label>

            <input
                type="date"
                id="date"
                name="date"
                required
            >

        </div>


        <!-- SUBMIT -->

        <button type="submit">
            ✨ Add Shiny
        </button>

    </form>

</div>


<script>

    // Store all Pokémon names
    let pokemonNames = [];


    // Load Pokémon names from our local JSON file
    fetch("/static/pokemon_names.json")

        .then(function(response) {

            if (!response.ok) {
                throw new Error(
                    "Could not load pokemon_names.json"
                );
            }

            return response.json();

        })

        .then(function(data) {

            pokemonNames = data;

            console.log(
                "Pokémon loaded:",
                pokemonNames.length
            );

        })

        .catch(function(error) {

            console.error(
                "Could not load Pokémon names:",
                error
            );

        });


    // Get the input box
    const input =
        document.getElementById("name");


    // Get the suggestions container
    const suggestions =
        document.getElementById("suggestions");


    // Run whenever the user types
    input.addEventListener(
        "input",
        function() {

            const search =
                input.value
                    .toLowerCase()
                    .trim();


            // Clear old suggestions
            suggestions.innerHTML = "";


            // Don't show anything if input is empty
            if (search === "") {
                return;
            }


            // Find matching Pokémon
            const matches =
                pokemonNames
                    .filter(function(pokemon) {

                        return pokemon
                            .toLowerCase()
                            .includes(search);

                    })
                    .slice(0, 8);


            // Create a suggestion for each match
            matches.forEach(
                function(pokemon) {

                    const option =
                        document.createElement("div");


                    option.classList.add(
                        "suggestion"
                    );


                    option.textContent =
                        pokemon;


                    // Click a suggestion
                    option.addEventListener(
                        "click",
                        function() {

                            input.value =
                                pokemon;

                            suggestions.innerHTML =
                                "";

                        }
                    );


                    suggestions.appendChild(
                        option
                    );

                }
            );

        }
    );


    // Close suggestions when clicking elsewhere
    document.addEventListener(
        "click",
        function(event) {

            if (
                !event.target.closest(
                    ".autocomplete"
                )
            ) {

                suggestions.innerHTML =
                    "";

            }

        }
    );

</script>

</body>

</html>
